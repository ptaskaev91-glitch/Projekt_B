name: Moscow direct recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moscow-direct-recovery.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
    steps:
      - name: Check SSH secret availability
        shell: bash
        run: |
          if [[ -z "$SSH_KEY" ]]; then
            echo 'SERVER_SSH_PRIVATE_KEY is not available in Projekt_B'
            exit 3
          fi
          echo 'SSH_SECRET_PRESENT=yes'
      - name: Connect and inspect disk safely
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_ed25519 root@88.218.169.68 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== HOST ==='
          hostname
          date -Is
          echo '=== DISK ==='
          df -hT /
          echo '=== TOP ROOT DIRS ==='
          du -xhd1 / 2>/dev/null | sort -h
          echo '=== VAR ==='
          du -xhd1 /var 2>/dev/null | sort -h
          echo '=== OPT TOP ==='
          du -xhd2 /opt 2>/dev/null | sort -h | tail -40
          echo '=== DOCKER ==='
          docker system df -v 2>/dev/null || true
          echo '=== JOURNAL ==='
          journalctl --disk-usage 2>/dev/null || true
          REMOTE
